    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const assignedSources = shuffle(["teenagers", "adults", "neutral"]);
    categories.forEach((cat, i) => {
      cat.source_type = assignedSources[i];

    });

    function readStoredJson(key, fallback) {

        return raw == null ? fallback : JSON.parse(raw);
      } catch (error) {

      }
    }

    function createEventId() {
      if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
        return globalThis.crypto.randomUUID();

      return "E" + Date.now() + "_" + Math.random().toString(36).slice(2, 14);
    }

      if (!candidate || candidate.version !== DATA_VERSION || !candidate.participant_id || !Array.isArray(candidate.categories)) {
        return null;
      }
      candidate.events = Array.isArray(candidate.events) ? candidate.events : [];
      let maxSequence = Number(candidate.event_seq) || 0;
      candidate.events.forEach(event => {
        if (!event.event_id) event.event_id = createEventId();
        if (!Number.isInteger(event.event_seq)) event.event_seq = ++maxSequence;
        maxSequence = Math.max(maxSequence, event.event_seq);
      });
      candidate.event_seq = maxSequence;
      candidate.completed = Boolean(candidate.completed || candidate.finished_at_iso);
      candidate.current_screen = candidate.current_screen || (candidate.completed ? "final" : "intro");
      candidate.current_context = candidate.current_context && typeof candidate.current_context === "object" ? candidate.current_context : {};

      candidate.bpns_draft = Array.isArray(candidate.bpns_draft) ? candidate.bpns_draft : Array(7).fill(null);

    function persistLocally() {
      try {
        localStorage.setItem(BACKUP_KEY, JSON.stringify(state));
        localStorage.setItem(OUTBOX_KEY, JSON.stringify(outbox));

    function wireEvent(event) {

        client_time: event.at_iso,
        event_type: String(event.trial_type || "survey_event").slice(0, 64),

        category_id: String(event.category_id || event.category_key || "").slice(0, 128),
        payload: JSON.parse(JSON.stringify(event))
      };
    }

    function buildSyncPayload(events) {
      const now = new Date().toISOString();
      return {
        participant_id: state.participant_id,
        study_version: state.version,
        session: {
          started_at: state.started_at_iso,
          updated_at: now,
          completed: Boolean(state.completed),
          current_screen: state.current_screen || "intro",
          condition_code: sourceConditionCode(),
          state: stateForServer(),
          device_type: deviceType()
        },
        events
      };
    }

    function scheduleSync(delay = 250) {
      if (syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        syncTimer = null;
        flushSyncQueue();
      }, delay);
    }

    function markStateDirty(delay = 250) {
      dirtySnapshot = true;
      localRevision += 1;
      persistLocally();
      setSyncStatus(navigator.onLine === false ? "offline" : "saving", navigator.onLine === false ? "Нет сети — сохранено на устройстве" : "Сохраняем ответы…");
      scheduleSync(delay);
    }

    function record(event) {
      const storedEvent = Object.assign({
        event_id: createEventId(),
        event_seq: ++state.event_seq,
        at_iso: new Date().toISOString(),
        at_local: new Date().toLocaleString(),
        screen_id: state.current_screen || "",
        category_id: event.category_key || ""
      }, event);
      state.events.push(storedEvent);
      outbox.push(wireEvent(storedEvent));
      state.sync_initialized = true;
      markStateDirty(40);
    }

    function setScreen(screenId, context = {}) {
      state.current_screen = screenId;
      state.current_context = context;
      markStateDirty(120);
    }

    async function flushSyncQueue() {
      if (syncInFlight || (!dirtySnapshot && outbox.length === 0)) return;
      if (navigator.onLine === false) {
        setSyncStatus("offline", "Нет сети — сохранено на устройстве");
        scheduleSync(5000);
        return;
      }

      const batch = outbox.slice(0, MAX_SYNC_EVENTS);
      const sentIds = new Set(batch.map(event => event.event_id));
      const sentRevision = localRevision;
      const controller = typeof AbortController === "function" ? new AbortController() : null;
      const timeout = controller ? setTimeout(() => controller.abort(), 10000) : null;
      syncInFlight = true;
      setSyncStatus("saving", "Сохраняем ответы…");

      try {
        const response = await fetch(RECEIVER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(buildSyncPayload(batch)),
          cache: "no-store",
          signal: controller ? controller.signal : undefined
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok) throw new Error(result.error || `HTTP ${response.status}`);

        outbox = outbox.filter(event => !sentIds.has(event.event_id));
        if (outbox.length === 0 && localRevision === sentRevision) dirtySnapshot = false;
        retryAttempt = 0;
        persistLocally();

        if (!dirtySnapshot && outbox.length === 0) {
          setSyncStatus("saved", "Ответы сохранены");
          if (state.completed) {
            try {
              localStorage.removeItem(BACKUP_KEY);
              localStorage.removeItem(OUTBOX_KEY);
              localStorage.removeItem(DIRTY_KEY);
            } catch (error) {}
          }
        } else {
          scheduleSync(80);
        }
      } catch (error) {
        retryAttempt += 1;
        persistLocally();
        setSyncStatus("offline", navigator.onLine === false ? "Нет сети — сохранено на устройстве" : "Связь прервалась — повторяем отправку");
        const retryDelay = Math.min(30000, 1000 * (2 ** Math.min(retryAttempt - 1, 5))) + Math.floor(Math.random() * 400);
        scheduleSync(retryDelay);
      } finally {
        if (timeout) clearTimeout(timeout);
        syncInFlight = false;
      }
    }

    function flushWithBeacon() {
      persistLocally();
      if ((!dirtySnapshot && outbox.length === 0) || !navigator.sendBeacon) return;
      let batch = outbox.slice(0, 8);
      let body = JSON.stringify(buildSyncPayload(batch));
      while (body.length > 60000 && batch.length > 0) {
        batch = batch.slice(0, -1);
        body = JSON.stringify(buildSyncPayload(batch));
      }
      if (body.length <= 60000) {
        navigator.sendBeacon(RECEIVER_URL, new Blob([body], { type: "text/plain;charset=UTF-8" }));
      }
    }

      const queuedIds = new Set(outbox.map(event => event.event_id));
      state.events.forEach(event => {
        if (!queuedIds.has(event.event_id)) outbox.push(wireEvent(event));
      });
      state.sync_initialized = true;
      dirtySnapshot = true;
      persistLocally();
    }

          class_or_course: demographicFields.class_or_course.value.trim(),

        };

      };
      Object.entries(demographicFields).forEach(([field, element]) => {
        element.addEventListener("input", captureDemographicDraft);
        element.addEventListener("change", () => {

          record({ trial_type: "demographic_field_changed", field, value: state.demographics[field] || "" });
        });

      document.getElementById("continueDemo").onclick = () => {

          gender,

        };

      };
    }

    const autonomyItems = [
      { source_item: 1, text: "Я чувствую, что имею полную свободу в выборе жизненного пути.", scoring: "direct" },
      { source_item: 4, text: "Я чувствую, что жизнь течёт мимо меня.", scoring: "reverse" },
      { source_item: 8, text: "Я чувствую себя свободным(ой) в выражении своих идей и мнений.", scoring: "direct" },
      { source_item: 11, text: "Обычно я делаю то, что мне говорят.", scoring: "reverse", wording_modified: true },
      { source_item: 14, text: "Люди, которые меня окружают, всегда учитывают моё мнение.", scoring: "direct" },
      { source_item: 17, text: "Я чувствую, что всегда могу быть самим(ой) собой.", scoring: "direct" },
      { source_item: "retained_final", text: "Мне кажется, что мои возможности выбора часто ограничивают.", scoring: "reverse", wording_retained: true }
    ];

    function showBPNS() {
      setScreen("bpns");
      const questions = autonomyItems.map((item, idx) => {
        const draftValue = Number(state.bpns_draft[idx]);
        const scale = [1,2,3,4,5,6,7].map(n => `
          <span>
            <input type="radio" id="bpns_${idx}_${n}" name="bpns_${idx}" value="${n}" ${draftValue === n ? "checked" : ""} />
            <label for="bpns_${idx}_${n}">${n}</label>
          </span>
        `).join("");
        return `
          <div class="likert-item">

            <div class="likert-scale">${scale}</div>

          </div>
        `;
      }).join("");

      setHTML(`
        <section class="card wide">
          <h2>Самостоятельность и свобода выбора</h2>
          <p>Ниже приведены утверждения из шкалы автономии. Отметьте, насколько вы согласны с каждым утверждением.</p>
          <div class="likert-list">${questions}</div>
          <div id="bpnsError" class="error">Пожалуйста, ответьте на все утверждения.</div>
          <div class="actions">${btn("Продолжить", "continueBPNS")}</div>

      `);

      autonomyItems.forEach((item, index) => {
        document.querySelectorAll(`input[name="bpns_${index}"]`).forEach(input => {
          input.addEventListener("change", () => {

            });

    function showSurveyIntro(step = 0) {

    function catData(index) { return state.categories[index]; }

    function relevanceFor(cat, improvement) {
      return cat.relevance_by_improvement[improvement] || "uncoded";
    }

    function chooseConfirmationTargets(cat) {
      cat.confirmation_targets = cat.ranking.slice();
      cat.confirmation_target_rule = "confirm_all_five_ranked_proposals";

      if (cat.source_type === "neutral") {
        cat.exclusion_targets = [];
        cat.exclusion_target_rule = "none_in_neutral_condition";
        return cat.confirmation_targets;
      }

      const fixedPositionTargets = EXCLUSION_POSITIONS
        .map(position => cat.ranking[position - 1])
        .filter(Boolean);
      const rankedCustomTarget = cat.custom_improvement && cat.ranking.includes(cat.custom_improvement)
        ? [cat.custom_improvement]
        : [];
      cat.exclusion_targets = Array.from(new Set([...fixedPositionTargets, ...rankedCustomTarget]));
      cat.exclusion_target_rule = "rank_positions_2_and_4_plus_ranked_custom_proposal";
      return cat.confirmation_targets;
    }

    function showCategoryIntro(index) {
      const cat = catData(index);
      setScreen("category_intro", { index });
      setHTML(`
        <section class="card narrow">
          <div class="pill">Категория ${index + 1} из ${state.categories.length}</div>
          <h2>${h(cat.category_title_ru)}</h2>

          <div class="actions">${btn("Начать категорию", "startCategory")}</div>
        </section>
      `);
      document.getElementById("startCategory").onclick = () => {

          custom_improvement: cat.custom_improvement
        });
        showRanking(index, null);

    function showRanking(index, selectedImprovement) {
      const cat = catData(index);
      setScreen("ranking", { index });
      const slots = cat.ranking.map((improvement, i) => `
        <div class="improvement-option ${improvement ? "" : "empty"}">
          <button class="slot ${selectedImprovement && improvement === selectedImprovement ? "selected" : ""}" data-slot="${i}">
            <span class="slot-number">${i + 1}</span>
            <span>${improvement ? h(improvement) : `<span class="slot-empty">Нажмите, чтобы поставить сюда выбранное улучшение</span>`}</span>
          </button>
        </div>
      `).join("");
      const pool = cat.pool.map(improvement => `
        <div class="improvement-option">
          <button class="improvement-btn ${selectedImprovement === improvement ? "selected" : ""}" data-improvement="${h(improvement)}">${h(improvement)}</button>
        </div>
      `).join("");
      const customImprovementControl = cat.custom_improvement ? `
        <div class="custom-improvement-box inline">
          <div class="custom-improvement-added">✓ Добавлено ваше предложение: ${h(cat.custom_improvement)}</div>
          <div class="muted small">Чтобы продолжить, включите своё предложение в рейтинг.</div>
        </div>
      ` : `
        <div class="custom-improvement-box inline">
          <label for="rankingCustomImprovement"><b>Добавить своё предложение</b><span class="optional-tag">НЕОБЯЗАТЕЛЬНО</span></label>
          <div class="custom-improvement-controls">
            <input id="rankingCustomImprovement" maxlength="120" autocomplete="off" placeholder="Ваше предложение" value="${h(cat.custom_improvement_draft || "")}" />
            <button id="addRankingCustomImprovement" class="btn" type="button">Добавить</button>
          </div>
          <div id="rankingCustomImprovementError" class="error">Введите предложение, которого ещё нет в списке.</div>
        </div>
      `;
      const selectedNote = selectedImprovement ? `<p class="warning"><b>Выбрано:</b> ${h(selectedImprovement)}. Теперь нажмите на позицию в рейтинге.</p>` : `<p class="muted">Сначала выберите улучшение из списка или из уже заполненной позиции.</p>`;
      const customRequirementMet = !cat.custom_improvement || cat.ranking.includes(cat.custom_improvement);
      const done = cat.ranking.every(Boolean) && customRequirementMet;
      const rankedCount = cat.ranking.filter(Boolean).length;

      setHTML(`
        <section class="card wide">
          <div class="pill">${h(cat.category_title_ru)}</div>
          <h2>Ранжирование улучшений</h2>
          <p>Из всех доступных вариантов выберите <b>5 предложений</b> и расположите их от 1 до 5. <b>На 1 месте</b> — самое важное для вас предложение; <b>на 5 месте</b> — наименее важное из выбранных пяти.</p>
          ${selectedNote}
          <div class="rank-layout">
            <div class="panel ranking-panel"><h4>Ваш рейтинг · ${rankedCount}/${RANKING_SIZE}</h4>${slots}</div>
            <div class="panel pool-panel"><h4>Выберите 5 предложений</h4>${customImprovementControl}${pool || `<p class="muted">Все доступные предложения уже добавлены в рейтинг.</p>`}<div id="dropPool" class="drop-pool ${selectedImprovement ? "visible" : ""}">Вернуть выбранное предложение в список</div></div>
          </div>
          <div id="rankError" class="error">Пожалуйста, расположите ровно 5 предложений и включите в рейтинг собственное предложение, если вы его добавили.</div>
          <div class="actions">${btn("Продолжить", "continueRanking", true, !done)}</div>
        </section>
      `);

      document.querySelectorAll("[data-improvement]").forEach(el => {
        el.onclick = () => showRanking(index, el.getAttribute("data-improvement"));
      });

      const customInput = document.getElementById("rankingCustomImprovement");
      const customButton = document.getElementById("addRankingCustomImprovement");
      const addCustomImprovement = () => {
        if (!customInput || cat.custom_improvement) return;
        const customImprovement = customInput.value.trim().replace(/\s+/g, " ");
        const duplicate = customImprovement && cat.preset_improvements.some(improvement => improvement.toLocaleLowerCase() === customImprovement.toLocaleLowerCase());
        if (!customImprovement || duplicate) {
          document.getElementById("rankingCustomImprovementError").style.display = "block";
          return;
        }
        cat.custom_improvement = customImprovement;
        cat.custom_improvement_draft = "";
        cat.relevance_by_improvement[customImprovement] = "uncoded";
        if (!cat.pool.includes(customImprovement)) cat.pool.unshift(customImprovement);
        record({
          trial_type: "custom_improvement_added",
          category_key: cat.category_key,
          source_type: cat.source_type,
          custom_improvement: customImprovement,
          context: "ranking_screen"
        });
        showRanking(index, customImprovement);
      };
      if (customButton) customButton.onclick = addCustomImprovement;
      if (customInput) {
        customInput.addEventListener("input", () => {
          cat.custom_improvement_draft = customInput.value;
          markStateDirty(350);
        });
        customInput.onkeydown = event => {
          if (event.key === "Enter") {
            event.preventDefault();
            addCustomImprovement();
          }
        };
      }

      document.querySelectorAll("[data-slot]").forEach(el => {
        el.onclick = () => {
          const slotIndex = Number(el.getAttribute("data-slot"));
          const current = cat.ranking[slotIndex];
          if (!selectedImprovement) {
            if (current) showRanking(index, current);
            return;
          }
          const previousRanking = cat.ranking.slice();
          removeImprovementFromRankingAndPool(cat, selectedImprovement);
          if (current && current !== selectedImprovement) {
            if (!cat.pool.includes(current)) cat.pool.push(current);
          }
          cat.ranking[slotIndex] = selectedImprovement;
          cat.pool = cat.pool.filter(x => x !== selectedImprovement);
          record({
            trial_type: "ranking_changed",
            category_key: cat.category_key,
            source_type: cat.source_type,
            action: "place",
            slot_position: slotIndex + 1,
            improvement: selectedImprovement,
            replaced_improvement: current || "",
            previous_ranking: previousRanking,
            ranking: cat.ranking.slice()
          });
          showRanking(index, null);
        };
      });

      const dropPool = document.getElementById("dropPool");
      if (dropPool) {
        dropPool.onclick = () => {
          if (!selectedImprovement) return;
          const previousRanking = cat.ranking.slice();
          removeImprovementFromRankingAndPool(cat, selectedImprovement);
          if (!cat.pool.includes(selectedImprovement)) cat.pool.push(selectedImprovement);
          record({
            trial_type: "ranking_changed",
            category_key: cat.category_key,
            source_type: cat.source_type,
            action: "remove",
            improvement: selectedImprovement,
            previous_ranking: previousRanking,
            ranking: cat.ranking.slice()
          });
          showRanking(index, null);
        };
      }

      const continueBtn = document.getElementById("continueRanking");
      if (continueBtn) {
        continueBtn.onclick = () => {
          if (!cat.ranking.every(Boolean) || (cat.custom_improvement && !cat.ranking.includes(cat.custom_improvement))) {
            document.getElementById("rankError").style.display = "block";
            return;
          }
          chooseConfirmationTargets(cat);
          record({
            trial_type: "ranking",
            category_key: cat.category_key,
            category_title: cat.category_title,
            category_title_ru: cat.category_title_ru,
            source_type: cat.source_type,
            ranking: cat.ranking.slice(),
            custom_improvement: cat.custom_improvement,
            relevance_by_ranked_improvement: cat.ranking.map(improvement => ({ improvement, relevance: relevanceFor(cat, improvement) })),
            confirmation_targets: cat.confirmation_targets.slice(),
            confirmation_target_positions: cat.confirmation_targets.map(improvement => cat.ranking.indexOf(improvement) + 1),
            confirmation_target_rule: cat.confirmation_target_rule,
            exclusion_targets: cat.exclusion_targets.slice(),
            exclusion_target_positions: cat.exclusion_targets.map(improvement => cat.ranking.indexOf(improvement) + 1),
            exclusion_target_rule: cat.exclusion_target_rule
          });
          showRankingConfirm(index);
        };
      }
    }

    function removeImprovementFromRankingAndPool(cat, improvement) {
      cat.ranking = cat.ranking.map(x => x === improvement ? null : x);
      cat.pool = cat.pool.filter(x => x !== improvement);
    }

    function showRankingConfirm(index) {
      const cat = catData(index);
      setScreen("ranking_confirm", { index });
      const rows = cat.ranking.map((improvement, i) => `<p><b>${i + 1}.</b> ${h(improvement)}</p>`).join("");
      setHTML(`

        </section>
      `);
      document.getElementById("confirmRanking").onclick = () => {

    function showInitialRatingIntro(index) {
      const cat = catData(index);
      setScreen("initial_rating_intro", { index });
      const sentence = "Пожалуйста, оцените, насколько полезным, по вашему мнению, было бы каждое из выбранных предложений.";
      setHTML(`

          </div>

      `);
      document.getElementById("startInitialRatings").onclick = () => {
        record({ trial_type: "initial_rating_intro", category_key: cat.category_key, instruction_text: sentence });
        showRating(index, 0, "initial");
      };
    }

    function assignGroupRatings(cat) {
      cat.group_ratings = {};
      cat.group_feedback_by_improvement = {};
      cat.positive_targets = [];
      cat.similar_targets = [];
      let minimumPrevious = "";
      let gapRule = cat.source_type === "neutral" ? "not_applicable_control_condition" : "";

      if (cat.exclusion_targets.length) {
        const exclusionRatings = cat.exclusion_targets.map(improvement => Number(cat.ratings[improvement]?.initial ?? 50));
        minimumPrevious = Math.min(...exclusionRatings);
        const requiredSpread = Math.max(0, (cat.exclusion_targets.length - 1) * 2);
        const strictCap = Math.min(39, Math.floor(minimumPrevious - 18));
        const flexibleCap = Math.min(39, Math.floor(minimumPrevious - 12));
        let scoreCap;

        if (strictCap >= requiredSpread) {
          scoreCap = strictCap;
          gapRule = "at_least_18_below_lowest_target_rating";
        } else if (flexibleCap >= requiredSpread) {
          scoreCap = flexibleCap;
          gapRule = "at_least_12_below_lowest_target_rating";
        } else {
          scoreCap = requiredSpread;
          gapRule = "distinct_floor_scores_for_already_very_low_rating";
        }

        const generatedScores = cat.exclusion_targets.map((_, index) =>
          scoreCap - ((cat.exclusion_targets.length - 1 - index) * 2)
        );

        cat.exclusion_targets.forEach((improvement, index) => {
          cat.group_ratings[improvement] = generatedScores[index];
          cat.group_feedback_by_improvement[improvement] = {
            condition: "excluded_low_support",
            offset_from_initial: generatedScores[index] - Number(cat.ratings[improvement].initial)
          };
        });
      }

      const eligibleForPositive = cat.ranking.filter(improvement =>
        !cat.exclusion_targets.includes(improvement) && Number(cat.ratings[improvement]?.initial) <= 80
      );
      cat.positive_targets = shuffle(eligibleForPositive).slice(0, POSITIVE_TARGET_COUNT);
      cat.similar_targets = cat.ranking.filter(improvement =>
        !cat.exclusion_targets.includes(improvement) && !cat.positive_targets.includes(improvement)
      );

      cat.positive_targets.forEach(improvement => {
        const previous = Number(cat.ratings[improvement].initial);
        cat.group_ratings[improvement] = previous + 20;
        cat.group_feedback_by_improvement[improvement] = {
          condition: cat.source_type === "neutral" ? "control_higher_group_rating" : "higher_group_rating",
          offset_from_initial: 20
        };
      });

      cat.similar_targets.forEach(improvement => {
        const previous = Number(cat.ratings[improvement].initial);
        const validOffsets = SIMILAR_RATING_OFFSETS.filter(offset => previous + offset >= 0 && previous + offset <= 100);
        const offset = shuffle(validOffsets)[0] ?? (previous < 100 ? 1 : -1);
        cat.group_ratings[improvement] = previous + offset;
        cat.group_feedback_by_improvement[improvement] = {
          condition: cat.source_type === "neutral" ? "control_similar_group_rating" : "similar_group_rating",
          offset_from_initial: offset
        };
      });

      record({
        trial_type: "group_ratings_generated",
        category_key: cat.category_key,
        source_type: cat.source_type,
        lowest_exclusion_target_rating: minimumPrevious,
        group_rating_gap_rule: gapRule,
        exclusion_targets: cat.exclusion_targets.slice(),
        positive_targets: cat.positive_targets.slice(),
        similar_targets: cat.similar_targets.slice(),
        positive_target_shortfall: Math.max(0, POSITIVE_TARGET_COUNT - cat.positive_targets.length),
        group_ratings: Object.assign({}, cat.group_ratings),
        group_feedback_by_improvement: Object.assign({}, cat.group_feedback_by_improvement)
      });
    }

    function getGroupRating(cat, improvement) {
      return cat.group_ratings[improvement] ?? null;
    }

    function getSourcePhrase(cat) {
      const age = state.demographics.age ? `${h(state.demographics.age)}-летних ` : "";
      if (cat.source_type === "teenagers") return `${age}подростков в России`;
      if (cat.source_type === "adults") return "россиян со средним возрастом 45 лет";
      if (cat.source_type === "neutral") return "других участников опроса";
      return "";
    }

    function getSourceGroupLabel(cat) {
      const age = state.demographics.age ? `${h(state.demographics.age)}-летние ` : "";
      if (cat.source_type === "teenagers") return `${age}подростки в России`;
      if (cat.source_type === "adults") return "Россияне со средним возрастом 45 лет";
      if (cat.source_type === "neutral") return "Другие участники опроса";
      return "";
    }

    function getSourceShort(cat) {
      const age = state.demographics.age ? `${h(state.demographics.age)}-летних` : "подростков вашего возраста";
      if (cat.source_type === "teenagers") return state.demographics.age ? `оценка ${age} подростков` : `оценка ${age}`;

      if (cat.source_type === "neutral") return "оценка других участников";

    function markerLeft(value) {
      const bounded = Math.max(0, Math.min(100, Number(value) || 0));
      return `${bounded}%`;
    }

    function markerEdgeClass(value) {
      const bounded = Math.max(0, Math.min(100, Number(value) || 0));
      if (bounded <= 12) return "edge-left";
      if (bounded >= 88) return "edge-right";
      return "";
    }

    function showSourceIntro(index) {
      const cat = catData(index);
      setScreen("source_intro", { index });
      const isNeutral = cat.source_type === "neutral";
      const sentence = isNeutral
        ? "Далее вы перейдёте к следующему этапу оценки предложений."
        : `На следующем экране вы увидите предложения с самой низкой поддержкой по оценкам ${getSourcePhrase(cat)}.`;
      setHTML(`
        <section class="instruction-stage">
          <div class="card instruction-card">
            <div class="pill">${h(cat.category_title_ru)}</div>
            <div class="instruction-sentence">${sentence}</div>
            <div class="actions">${btn(isNeutral ? "Продолжить" : "Показать результаты", "continueToResults")}</div>
          </div>
        </section>
      `);
      document.getElementById("continueToResults").onclick = () => {
        record({
          trial_type: "source_intro",
          category_key: cat.category_key,
          source_type: cat.source_type,
          source_label: cat.source_label,
          instruction_text: sentence
        });
        if (isNeutral) {
          showRating(index, 0, "confirm");
        } else {
          showGroupResultsScreen(index);
        }
      };
    }

    function showRating(index, rankIndex, phase) {
      const cat = catData(index);
      setScreen("rating", { index, rankIndex, phase });
      const phaseImprovements = phase === "initial" ? cat.ranking : cat.confirmation_targets;
      const improvement = phaseImprovements[rankIndex];
      const rankPosition = cat.ranking.indexOf(improvement) + 1;
      const rating = cat.ratings[improvement] || {};
      const isConfirmationTarget = cat.confirmation_targets.includes(improvement);
      const isManipulated = cat.source_type !== "neutral" && isConfirmationTarget;
      const isExclusionTarget = cat.exclusion_targets.includes(improvement);
      const isPositiveTarget = cat.positive_targets.includes(improvement);
      const feedback = cat.group_feedback_by_improvement[improvement] || null;
      const hasAssignedGroupRating = Object.prototype.hasOwnProperty.call(cat.group_ratings, improvement);
      const previous = rating.initial;
      const groupRating = phase === "confirm" && hasAssignedGroupRating ? getGroupRating(cat, improvement) : null;
      const showGroup = groupRating != null;
      const draftKey = `${phase}:${improvement}`;
      const defaultStart = phase === "initial" ? 50 : previous;
      const start = Object.prototype.hasOwnProperty.call(cat.rating_drafts, draftKey)
        ? Number(cat.rating_drafts[draftKey])
        : defaultStart;
      const title = phase === "initial" ? "Оценка предложения" : "Пожалуйста, подтвердите вашу оценку";
      const subtitle = phase === "initial"
        ? "Укажите, насколько полезным для вас было бы это предложение."
        : showGroup
          ? "Ваша предыдущая оценка и средняя оценка группы отмечены на шкале. Вы можете оставить свой ответ прежним или изменить его."
          : "Ваша предыдущая оценка отмечена на шкале. Вы можете оставить её прежней или изменить.";

      const previousMarker = phase === "confirm" ? `<div class="marker ${markerEdgeClass(previous)}" style="left:${markerLeft(previous)}"><span class="marker-label">ваша предыдущая: ${previous}</span></div>` : "";
      const groupMarker = showGroup ? `<div class="marker group ${isExclusionTarget ? "excluded" : ""} ${markerEdgeClass(groupRating)}" style="left:${markerLeft(groupRating)}"><span class="marker-label">${getSourceShort(cat)}: ${groupRating}</span></div>` : "";
      const sourceNote = showGroup ? `
        <div class="source-note ${isExclusionTarget ? "trigger" : "context"}">
          <span class="source-kicker">Оценки: ${getSourceGroupLabel(cat)}</span>
          По оценкам ${getSourcePhrase(cat)}, предложение <b>${h(improvement)}</b> получило среднюю оценку <b>${groupRating}/100</b>.
          ${isExclusionTarget ? "Из-за низкой поддержки голос за это предложение не будет засчитан." : ""}
        </div>
      ` : "";

      setHTML(`
        <section class="card rating-card">
          <div class="pill">${h(cat.category_title_ru)}</div>
          <div class="rating-title">${title}</div>
          <p>${subtitle}</p>
          <div class="improvement-heading">
            <div class="improvement-name">${h(improvement)}</div>
          </div>
          <p class="muted">Позиция в вашем рейтинге: ${rankPosition} из ${RANKING_SIZE}</p>
          ${sourceNote}
          <div class="slider-wrap ${showGroup ? "has-group" : ""}">
            ${previousMarker}${groupMarker}
            <input id="ratingSlider" type="range" min="0" max="100" step="1" value="${start}" />
          </div>
          <div class="scale-labels"><span>0 — совсем не полезно</span><span>100 — очень полезно</span></div>
          <div class="value-line center">Текущая оценка: <b><span id="ratingValue">${start}</span>/100</b></div>
          <div class="actions">${btn("Продолжить", "continueRating")}</div>
        </section>
      `);

      const slider = document.getElementById("ratingSlider");
      const value = document.getElementById("ratingValue");
      slider.oninput = () => {
        value.textContent = slider.value;
        cat.rating_drafts[draftKey] = Number(slider.value);
        markStateDirty(300);
      };
      slider.onchange = () => {
        cat.rating_drafts[draftKey] = Number(slider.value);
        record({
          trial_type: "rating_slider_changed",
          rating_phase: phase,
          category_key: cat.category_key,
          source_type: cat.source_type,
          improvement,
          rank_position: rankPosition,
          rating_value: Number(slider.value)
        });
      };
      document.getElementById("continueRating").onclick = () => {
        const finalValue = Number(slider.value);
        delete cat.rating_drafts[draftKey];
        if (!cat.ratings[improvement]) cat.ratings[improvement] = {};
        if (phase === "initial") {
          cat.ratings[improvement].initial = finalValue;
        } else {
          cat.ratings[improvement].confirm = finalValue;
          cat.ratings[improvement].change = finalValue - previous;
          cat.ratings[improvement].group_rating = groupRating;
          cat.ratings[improvement].was_group_marker_shown = showGroup ? 1 : 0;
        }
        record({
          trial_type: "improvement_rating",
          rating_phase: phase,
          category_key: cat.category_key,
          category_title: cat.category_title,
          source_type: cat.source_type,
          improvement,
          rank_position: rankPosition,
          improvement_relevance: relevanceFor(cat, improvement),
          is_confirmation_target: isConfirmationTarget ? 1 : 0,
          is_exclusion_target: isExclusionTarget ? 1 : 0,
          is_positive_target: isPositiveTarget ? 1 : 0,
          is_manipulated_position: isManipulated ? 1 : 0,
          group_feedback_condition: feedback?.condition || (cat.source_type === "neutral" ? "neutral_confirmation" : ""),
          assigned_group_rating_offset: feedback?.offset_from_initial ?? "",
          rating_value: finalValue,
          previous_rating: phase === "confirm" ? previous : "",
          group_rating: groupRating == null ? "" : groupRating,
          rating_change_from_previous: phase === "confirm" ? finalValue - previous : ""
        });

        if (rankIndex < phaseImprovements.length - 1) {
          showRating(index, rankIndex + 1, phase);
        } else if (phase === "initial") {
          assignGroupRatings(cat);
          showSourceIntro(index);
        } else {
          finishCategory(index);
        }
      };
    }

    function showGroupResultsScreen(index) {
      const cat = catData(index);
      if (cat.source_type === "neutral") {
        showRating(index, 0, "confirm");
        return;
      }
      setScreen("group_results", { index });
      const lowSupportImprovements = cat.exclusion_targets.map(improvement => {
        const position = cat.ranking.indexOf(improvement) + 1;
        const group = getGroupRating(cat, improvement);
        return { position, improvement, relevance: relevanceFor(cat, improvement), group_rating: group };
      });
      cat.low_support_improvements = lowSupportImprovements;
      const cards = lowSupportImprovements.map(x => `
        <div class="low-support-card">
          ${h(x.improvement)}<br><span class="small">Позиция в вашем рейтинге: ${x.position} из ${RANKING_SIZE} · ${getSourceShort(cat)}: ${x.group_rating}/100</span>
        </div>
      `).join("");
      setHTML(`
        <section class="card narrow">
          <div class="pill">${h(cat.category_title_ru)}</div>
          <h2>Предварительные результаты опроса</h2>
          <div class="source-banner">
            Следующие предложения получили низкие оценки по результатам голосования <strong>${getSourcePhrase(cat)}</strong>. Голоса за них не будут засчитаны.
          </div>
          <div class="low-support-list">${cards}</div>
          <p class="muted">Далее будет задан короткий вопрос о только что показанных результатах.</p>
          <div class="actions">${btn("Продолжить", "goAttentionCheck")}</div>
        </section>
      `);
      document.getElementById("goAttentionCheck").onclick = () => {
        record({ trial_type: "group_results_screen", category_key: cat.category_key, source_type: cat.source_type, low_support_improvements: lowSupportImprovements });
        showAttentionCheck(index);
      };
    }

    function showAttentionCheck(index) {
      const cat = catData(index);
      setScreen("attention_check", { index });
      const age = state.demographics.age ? `${state.demographics.age}-летние подростки в России` : "Подростки в России вашего возраста";
      const correctOption = cat.source_type === "teenagers"
        ? { value: "teenagers", label: age }
        : { value: "adults", label: "Россияне со средним возрастом 45 лет" };
      const options = shuffle([
        correctOption,
        { value: "teachers", label: "Учителя российских школ" },
        { value: "university_students", label: "Студенты российских университетов" },
        { value: "parents", label: "Родители подростков в России" }
      ]);
      const optionRows = options.map(option => `
        <label class="attention-option" for="attention_${option.value}">
          <input id="attention_${option.value}" type="radio" name="attention_source" value="${option.value}" ${cat.attention_draft === option.value ? "checked" : ""} />
          <span>${h(option.label)}</span>
        </label>
      `).join("");

      setHTML(`
        <section class="card narrow">
          <div class="pill">${h(cat.category_title_ru)}</div>
          <h2>Короткий вопрос</h2>
          <p><b>Какая группа, согласно только что показанным результатам, поставила этим предложениям низкие оценки?</b></p>
          <div class="attention-options">${optionRows}</div>
          <div id="attentionError" class="error">Пожалуйста, выберите один вариант.</div>
          <div class="actions">${btn("Продолжить", "continueAttentionCheck")}</div>
        </section>
      `);

      document.querySelectorAll('input[name="attention_source"]').forEach(input => {
        input.addEventListener("change", () => {
          cat.attention_draft = input.value;
          record({
            trial_type: "attention_option_changed",
            category_key: cat.category_key,
            source_type: cat.source_type,
            selected_source_type: input.value
          });
        });
      });

      document.getElementById("continueAttentionCheck").onclick = () => {
        const selected = document.querySelector('input[name="attention_source"]:checked');
        if (!selected) {
          document.getElementById("attentionError").style.display = "block";
          return;
        }
        cat.attention_check = {
          question_key: "low_support_group_source_recall",
          selected_source_type: selected.value,
          correct_source_type: cat.source_type,
          correct: selected.value === cat.source_type ? 1 : 0
        };
        cat.attention_draft = selected.value;
        record({
          trial_type: "attention_check",
          category_key: cat.category_key,
          source_type: cat.source_type,
          response: Object.assign({}, cat.attention_check)
        });
        showRating(index, 0, "confirm");
      };
    }

    function finishCategory(index) {
      const cat = catData(index);
      record({ trial_type: "category_finished", category_key: cat.category_key, source_type: cat.source_type });
      if (index < state.categories.length - 1) {
        show2048Break(index, index + 1);
      } else {
        showFinal();
      }
    }

    // -----------------------------------------------------
    // 2048 break
    // -----------------------------------------------------

    let breakGame = null;
    let breakTimer = null;
    let breakActive = false;
    let touchStartX = 0;
    let touchStartY = 0;

    function show2048Break(previousIndex, nextIndex) {
      breakActive = true;
      breakGame = createGameState();
      setScreen("break_2048", { previousIndex, nextIndex });
      setHTML(`
        <section class="card wide">
          <h2>Перерыв 30 секунд</h2>
          <p>Можно немного отвлечься. Играйте в мини-версию 2048, пока идёт таймер. Через 30 секунд следующая категория откроется автоматически.</p>
          <div class="break-layout">
            <div class="game-wrap" id="gameWrap">
              <div class="game-top"><div class="timer">Осталось: <span id="breakSeconds">30</span> сек.</div><div class="score">Очки: <span id="scoreValue">0</span></div></div>
              <div id="gameGrid" class="game-grid" aria-label="2048 grid"></div>
              <div class="game-controls">
                <button class="up" id="moveUp">↑</button>
                <button class="left" id="moveLeft">←</button>
                <button class="down" id="moveDown">↓</button>
                <button class="right" id="moveRight">→</button>
              </div>
            </div>
            <div>
              <h3>Как играть</h3>
              <p>Используйте стрелки на клавиатуре, свайпы по полю или кнопки под полем. Одинаковые числа соединяются.</p>
              <p class="muted">Это просто короткая пауза между категориями. Результат игры не влияет на исследование.</p>
              <p class="muted center"><strong>Следующая категория откроется автоматически.</strong></p>
            </div>
          </div>
        </section>
      `);
      renderGame();

      const bindMove = (id, dir) => document.getElementById(id).onclick = () => moveGame(dir);
      bindMove("moveUp", "up");
      bindMove("moveLeft", "left");
      bindMove("moveDown", "down");
      bindMove("moveRight", "right");

      const wrap = document.getElementById("gameWrap");
      wrap.addEventListener("touchstart", e => {
        const t = e.changedTouches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
      }, { passive: true });
      wrap.addEventListener("touchend", e => {
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
        if (Math.abs(dx) > Math.abs(dy)) moveGame(dx > 0 ? "right" : "left");
        else moveGame(dy > 0 ? "down" : "up");
      }, { passive: true });

      let seconds = 30;
      breakTimer = setInterval(() => {
        seconds -= 1;
        const secondsEl = document.getElementById("breakSeconds");
        if (secondsEl) secondsEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(breakTimer);
          breakTimer = null;
          breakActive = false;
          record({ trial_type: "break_2048_completed", after_category_index: previousIndex, score: breakGame.score });
          showCategoryIntro(nextIndex);
        }
      }, 1000);
    }

    document.addEventListener("keydown", e => {
      if (!breakActive || !breakGame) return;
      const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
      if (map[e.key]) {
        e.preventDefault();
        moveGame(map[e.key]);
      }
    });

    function createGameState() {
      const game = { grid: Array(16).fill(0), score: 0 };
      addTile(game);
      addTile(game);
      return game;
    }

    function addTile(game) {
      const empty = game.grid.map((v, i) => v === 0 ? i : -1).filter(i => i >= 0);
      if (!empty.length) return;
      const idx = empty[Math.floor(Math.random() * empty.length)];
      game.grid[idx] = Math.random() < 0.9 ? 2 : 4;
    }

    function renderGame() {
      const grid = document.getElementById("gameGrid");
      if (!grid) return;
      grid.innerHTML = breakGame.grid.map(v => `<div class="tile ${v ? "v" + v : ""}">${v || ""}</div>`).join("");
      document.getElementById("scoreValue").textContent = breakGame.score;
    }

    function moveGame(dir) {
      const before = breakGame.grid.join(",");
      let rows = [];
      for (let r = 0; r < 4; r++) rows.push(breakGame.grid.slice(r * 4, r * 4 + 4));

      function col(c) { return [breakGame.grid[c], breakGame.grid[c + 4], breakGame.grid[c + 8], breakGame.grid[c + 12]]; }
      function setCol(c, values) { for (let r = 0; r < 4; r++) breakGame.grid[c + r * 4] = values[r]; }
      function mergeLine(line) {
        const nums = line.filter(Boolean);
        const merged = [];
        for (let i = 0; i < nums.length; i++) {
          if (nums[i] === nums[i + 1]) {
            const value = nums[i] * 2;
            merged.push(value);
            breakGame.score += value;
            i++;
          } else {
            merged.push(nums[i]);
          }
        }
        while (merged.length < 4) merged.push(0);
        return merged;
      }

      if (dir === "left" || dir === "right") {
        for (let r = 0; r < 4; r++) {
          let line = breakGame.grid.slice(r * 4, r * 4 + 4);
          if (dir === "right") line.reverse();
          line = mergeLine(line);
          if (dir === "right") line.reverse();
          for (let c = 0; c < 4; c++) breakGame.grid[r * 4 + c] = line[c];
        }
      } else {
        for (let c = 0; c < 4; c++) {
          let line = col(c);
          if (dir === "down") line.reverse();
          line = mergeLine(line);
          if (dir === "down") line.reverse();
          setCol(c, line);
        }
      }

      if (before !== breakGame.grid.join(",")) {
        addTile(breakGame);
        renderGame();
      }
    }

    // -----------------------------------------------------
    // Final data export
    // -----------------------------------------------------

    function makeTrialRows() {
      const rows = [];
      state.categories.forEach(cat => {
        cat.ranking.forEach((improvement, idx) => {
          const r = cat.ratings[improvement] || {};
          rows.push({
            participant_id: state.participant_id,
            age: state.demographics.age || "",
            gender: state.demographics.gender || "",
            class_or_course: state.demographics.class_or_course || "",
            city: state.demographics.city || "",
            bpns_autonomy_satisfaction_mean: state.bpns_autonomy_satisfaction.mean || "",
            category_key: cat.category_key,
            category_title: cat.category_title,
            source_type: cat.source_type,
            source_label: cat.source_label,
            rank_position: idx + 1,
            improvement,
            improvement_pool_reviewed_at: state.improvement_pool_reviewed_at,
            presented_improvement_count: cat.preset_improvements.length + (cat.custom_improvement ? 1 : 0),
            category_unranked_improvements: cat.pool.join(" | "),
            improvement_relevance: relevanceFor(cat, improvement),
            is_custom_improvement: cat.custom_improvement === improvement ? 1 : 0,
            is_confirmation_target: cat.confirmation_targets.includes(improvement) ? 1 : 0,
            confirmation_target_rule: cat.confirmation_target_rule,
            is_exclusion_target: cat.exclusion_targets.includes(improvement) ? 1 : 0,
            exclusion_target_rule: cat.exclusion_target_rule,
            vote_counted: cat.exclusion_targets.includes(improvement) ? 0 : 1,
            is_positive_target: cat.positive_targets.includes(improvement) ? 1 : 0,
            is_similar_target: cat.similar_targets.includes(improvement) ? 1 : 0,
            is_manipulated_position: cat.source_type !== "neutral" && cat.confirmation_targets.includes(improvement) ? 1 : 0,
            group_feedback_condition: cat.group_feedback_by_improvement[improvement]?.condition || (cat.source_type === "neutral" ? "neutral_confirmation" : ""),
            assigned_group_rating_offset: cat.group_feedback_by_improvement[improvement]?.offset_from_initial ?? "",
            attention_check_selected_source: cat.attention_check?.selected_source_type || "",
            attention_check_correct_source: cat.attention_check?.correct_source_type || "",
            attention_check_correct: cat.attention_check?.correct ?? "",
            initial_rating: r.initial ?? "",
            confirm_rating: r.confirm ?? "",
            assigned_group_rating: cat.group_ratings[improvement] ?? "",
            group_rating: r.group_rating ?? "",
            was_group_marker_shown: r.was_group_marker_shown ?? 0,
            rating_change: r.change ?? ""
          });
        });
      });
      return rows;
    }

    function toCSV(rows) {
      const headers = Object.keys(rows[0] || {empty: ""});
      const esc = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
      return headers.join(",") + "\n" + rows.map(row => headers.map(h => esc(row[h])).join(",")).join("\n");
    }

    function download(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function showFinal() {
      const firstCompletion = !state.completed;
      if (firstCompletion) {
        state.completed = true;
        state.finished_at_iso = new Date().toISOString();
        state.finished_at_local = new Date().toLocaleString();
      }
      setScreen("final");
      if (firstCompletion) record({ trial_type: "survey_finished" });
      setHTML(`
        <section class="card narrow">
          <h2>Спасибо за участие!</h2>
          <p>Опрос завершён.</p>
          <div id="finalSaveStatus" class="warning">Ответы сохраняются…</div>
          <p><b>ID участника:</b> ${h(state.participant_id)}</p>
          <p class="muted">Если соединение временно прервётся, локальная резервная копия останется на этом устройстве и отправка повторится автоматически.</p>
        </section>
      `);
      scheduleSync(0);
    }

    function resumeCurrentScreen() {
      const screen = state.current_screen || "intro";
      const context = state.current_context || {};
      const index = Number.isInteger(Number(context.index)) ? Number(context.index) : 0;
      const safeIndex = index >= 0 && index < state.categories.length ? index : 0;

      switch (screen) {
        case "demographics": showDemographics(); break;
        case "bpns": showBPNS(); break;
        case "survey_instruction": showSurveyIntro(Number(context.step) || 0); break;
        case "category_intro": showCategoryIntro(safeIndex); break;
        case "ranking": showRanking(safeIndex, null); break;
        case "ranking_confirm": showRankingConfirm(safeIndex); break;
        case "initial_rating_intro": showInitialRatingIntro(safeIndex); break;
        case "rating": {
          const phase = context.phase === "confirm" ? "confirm" : "initial";
          const rankIndex = Math.max(0, Number(context.rankIndex) || 0);
          showRating(safeIndex, rankIndex, phase);
          break;
        }
        case "source_intro": showSourceIntro(safeIndex); break;
        case "group_results": showGroupResultsScreen(safeIndex); break;
        case "attention_check": showAttentionCheck(safeIndex); break;
        case "break_2048": {
          const previousIndex = Math.max(0, Number(context.previousIndex) || 0);
          const nextIndex = Math.min(state.categories.length - 1, Math.max(0, Number(context.nextIndex) || 1));
          show2048Break(previousIndex, nextIndex);
          break;
        }
        case "final": showFinal(); break;
        default: showIntro();
      }
    }

    if (state.completed) {
      showFinal();
    } else if (restoredSession) {
      const previousScreen = state.current_screen || "intro";
      record({ trial_type: "survey_resumed", previous_screen: previousScreen });
      resumeCurrentScreen();
    } else {
      showIntro();
      record({ trial_type: "survey_opened" });
    }
  </script>
</body>
</html>
