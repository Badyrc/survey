    return{participant_id:state.participantId,study_version:state.version,session:{started_at:state.startedAtIso,updated_at:state.updatedAtIso,completed:state.completed,current_screen:state.screen,condition_code:`${sourceCode(state.categories[0])}_then_${sourceCode(state.categories[1])}_L${state.categories[0].lowPosition+1}${state.categories[1].lowPosition+1}`,state,device_type:matchMedia("(max-width:760px)").matches||navigator.maxTouchPoints>0?"mobile":"desktop"},events:state.events.slice(-20).map(e=>({event_id:e.eventId,event_seq:e.eventSeq,client_time:e.atIso,event_type:e.eventType,screen_id:e.screenId,category_id:e.categoryKey||"",payload:e}))};
  }
  function persist(){
    try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
    clearTimeout(saveTimer);
    saveTimer=setTimeout(save,state.completed?0:700);
  }
  async function postUpload(body,keepalive){
    const options={method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body,cache:"no-store",credentials:"omit",keepalive};
    try{
      const r=await fetch(RECEIVER,options);
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok)throw new Error(`Upload rejected (${r.status})`);
      return{confirmed:true};
    }catch(primaryError){
      console.error("Survey upload failed; trying Telegram-safe fallback:",primaryError);
      await fetch(RECEIVER,{...options,mode:"no-cors"});
      return{confirmed:false};
    }
  }
  async function save(){
    if(saveInFlight){saveQueued=true;return saveInFlight}
    const snapshotUpdatedAt=state.updatedAtIso;
    const body=JSON.stringify(buildUploadPayload());
    const keepalive=new Blob([body]).size<=60000;
    saveInFlight=(async()=>{
      try{
        const result=await postUpload(body,keepalive);
        retryCount=0;
        clearTimeout(retryTimer);
        if(state.completed&&result.confirmed)localStorage.removeItem(KEY);
        return true;
      }catch(e){
        console.error("Survey upload failed:",e);
        if(retryCount<4){
          retryCount+=1;
          clearTimeout(retryTimer);
          retryTimer=setTimeout(save,retryCount*1500);
        }
        return false;
      }finally{
        saveInFlight=null;
        if(saveQueued||state.updatedAtIso!==snapshotUpdatedAt){
          saveQueued=false;
          clearTimeout(saveTimer);
          saveTimer=setTimeout(save,0);
        }
      }
    })();
    return saveInFlight;
  }
  function sendExitBackup(){
    try{
      const body=JSON.stringify(buildUploadPayload());
      const blob=new Blob([body],{type:"text/plain;charset=UTF-8"});
      if(blob.size<=60000&&navigator.sendBeacon&&navigator.sendBeacon(RECEIVER,blob))return;
      fetch(RECEIVER,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body,cache:"no-store",credentials:"omit",mode:"no-cors",keepalive:blob.size<=60000}).catch(()=>{});
    }catch(e){}
  }

  const shell=body=>body;
  const progress=(i,phase)=>`<div class="progress"><span>${phase==="vote"?"Ваш выбор":phase==="exposure"?"Оценки участников":"Оценка идей"}</span><b>${i+1} / 2</b></div>`;
  const shownItems=c=>Array.isArray(c.feedbackItems)&&c.feedbackItems.length?c.feedbackItems:c.selected;
  function groupRatings(c){
    const rated=c.selected.map((item,index)=>({item,index,rating:c.initialRatings[item]}));
    const eligible=rated.filter(x=>x.rating>=70);

    let lowCandidates;
    if(eligible.length){
      const lowestEligible=Math.min(...eligible.map(x=>x.rating));
      lowCandidates=eligible.filter(x=>x.rating===lowestEligible);
      c.lowThresholdMet=true;
      c.lowSelectionRule="lowest_rating_at_least_70";
    }else{
      const highestOverall=Math.max(...rated.map(x=>x.rating));
      lowCandidates=rated.filter(x=>x.rating===highestOverall);
      c.lowThresholdMet=false;
      c.lowSelectionRule="fallback_highest_rating_no_item_at_least_70";
    }

    const lowChoice=lowCandidates[ri(0,lowCandidates.length-1)];
    c.lowPosition=lowChoice.index;

    const remaining=rated.filter(x=>x.index!==c.lowPosition);

    // A positive target is only usable when there is room for a genuine
    // increase of at least 20 points without hitting the 97-point cap.
    const highEligible=remaining.filter(x=>97-x.rating>=20);
    let highChoice=null;
    if(highEligible.length){
      const highestEligible=Math.max(...highEligible.map(x=>x.rating));
      const highCandidates=highEligible.filter(x=>x.rating===highestEligible);
      highChoice=highCandidates[ri(0,highCandidates.length-1)];
      c.highPosition=highChoice.index;
      c.highTargetIncluded=true;
      c.highSelectionRule="highest_remaining_with_at_least_20_points_upward_room";
    }else{
      c.highPosition=null;
      c.highTargetIncluded=false;
      c.highSelectionRule="converted_to_control_no_room_for_minimum_20_point_increase";
    }

    const stableCandidates=remaining.filter(x=>!highChoice||x.index!==highChoice.index);
    const lowestStableRating=Math.min(...stableCandidates.map(x=>x.rating));
    const stableTies=stableCandidates.filter(x=>x.rating===lowestStableRating);
    const stableChoice=stableTies[ri(0,stableTies.length-1)];
    c.controlPosition=stableChoice.index;

    const low=lowChoice.item;
    const stable=stableChoice.item;
    const lowRating=ri(11,19);

    // Keep every control discrepancy between 1 and 5 actual points.
    const makeControlDelta=rating=>{
      const directions=[];
      if(rating>0)directions.push(-1);
      if(rating<97)directions.push(1);
      const sign=directions[ri(0,directions.length-1)];
      const room=sign>0?97-rating:rating;
      return sign*ri(1,Math.min(5,room));
    };

    c.lowDelta=lowRating-c.initialRatings[low];
    c.groupRatings={[low]:lowRating};

    const controlChoices=highChoice?[stableChoice]:remaining;
    const controlDeltas={};
    controlChoices.forEach(choice=>{
      const rating=c.initialRatings[choice.item];
      const delta=makeControlDelta(rating);
      controlDeltas[choice.item]=delta;
      c.groupRatings[choice.item]=rating+delta;
    });
    c.controlDelta=controlDeltas[stable];
    c.controlDeltas=controlDeltas;

    if(highChoice){
      const high=highChoice.item;
      const maxHighDelta=Math.min(30,97-c.initialRatings[high]);
      const highDelta=ri(20,maxHighDelta);
      c.groupRatings[high]=c.initialRatings[high]+highDelta;
      c.highDelta=highDelta;
    }else{
      c.highDelta=null;
    }

    c.feedbackItems=c.selected.filter(item=>hasOwn(c.groupRatings,item));
    c.omittedItems=c.selected.filter(item=>!hasOwn(c.groupRatings,item));
  }

    on("continue-demo",()=>{
      const a=+state.demographics.age,isAdult=a>=18;
      if(!Number.isInteger(a)||a<14||a>19||!state.demographics.gender){
        error="Укажите возраст от 14 до 19 лет и выберите пол.";
        render();
        return;
      }
      if(isAdult){
        if(state.demographics.relationshipStatus==="not_asked_under_18")state.demographics.relationshipStatus="";
        if(state.demographics.livingArrangement==="not_asked_under_18")state.demographics.livingArrangement="";
        go("adult_demographics","basic_demographics_submitted",{age:state.demographics.age,gender:state.demographics.gender,classOrCourse:state.demographics.classOrCourse,city:state.demographics.city});
        return;
      }
      state.demographics.relationshipStatus="not_asked_under_18";
      state.demographics.livingArrangement="not_asked_under_18";
      state.categories.forEach(c=>c.comparisonSourceAge=c.comparisonSource==="adults_49"?49:a);
      go("bpns","demographics_submitted",{...state.demographics});
    });
    on("continue-adult-demo",()=>{
      const a=+state.demographics.age;
      if(!state.demographics.livingArrangement||!state.demographics.relationshipStatus){
        error="Ответьте на оба вопроса.";
        render();
        return;
      }
      state.categories.forEach(c=>c.comparisonSourceAge=c.comparisonSource==="adults_49"?49:a);
      go("bpns","demographics_submitted",{...state.demographics});
    });
    on("continue-bpns",()=>{if(state.autonomyResponses.some(x=>x===null)||state.initialSelfLiking===null){error="Ответьте на все вопросы.";render();return}go("instruction","autonomy_subscale_submitted",{raw_responses:state.autonomyResponses,item_ids:autonomy.map(x=>x[0]),responses:autonomy.map((x,i)=>({item_id:x[0],response:state.autonomyResponses[i]})),initial_skill_self_rating:state.initialSkillSelfRating,initial_self_liking:state.initialSelfLiking})});
    on("start",()=>go("selection","task_instruction_viewed",{instruction_count:1}));
    on("confirm-select",()=>{if(csel().selected.length!==3)return;const c=csel();go("rating_intro","three_ideas_confirmed",{selected_ideas:c.selected},c.key)});
    on("start-rating",()=>go("initial_rating","rating_instruction_viewed",{},csel().key));
    on("submit-initial",()=>{const c=csel();if(!c.selected.every(x=>hasOwn(c.initialRatings,x)))return;groupRatings(c);event("initial_ratings_submitted",{selected_ideas:c.selected,ratings:c.initialRatings,comparison_source:c.comparisonSource,comparison_source_age:c.comparisonSourceAge,low_position:c.lowPosition+1,control_position:c.controlPosition+1,high_position:c.highPosition===null?null:c.highPosition+1,feedback_items:c.feedbackItems,omitted_items:c.omittedItems,low_threshold_met:c.lowThresholdMet,low_selection_rule:c.lowSelectionRule,control_delta:c.controlDelta,high_target_included:c.highTargetIncluded,high_selection_rule:c.highSelectionRule},c.key);if(state.categoryIndex===0){state.categoryIndex=1;state.screen="selection"}else{state.feedbackIndex=0;state.screen="group_exposure";event("feedback_phase_started",{},state.categories[0].key)}render();scrollTo(0,0)});
    on("continue-exposure",()=>{const f=state.categories[state.feedbackIndex],source=sourceDetails(f.comparisonSource,f.comparisonSourceAge??state.demographics.age);go("second_rating_intro","group_ratings_viewed",{comparison_source:f.comparisonSource,comparison_source_age:source.age,group_ratings:f.groupRatings,feedback_items:f.feedbackItems,omitted_items:f.omittedItems,low_position:f.lowPosition+1,control_position:f.controlPosition+1,high_position:f.highPosition===null?null:f.highPosition+1,low_threshold_met:f.lowThresholdMet,low_selection_rule:f.lowSelectionRule,control_delta:f.controlDelta,high_target_included:f.highTargetIncluded,high_selection_rule:f.highSelectionRule},f.key)});
    on("start-second-rating",()=>{const f=state.categories[state.feedbackIndex];f.reratings={};go("second_rating","second_rating_instruction_viewed",{slider_start_position:0,displayed_initial_grade:0},f.key)});
    on("submit-rerating",()=>{const f=state.categories[state.feedbackIndex],items=f.selected;if(!items.every(x=>hasOwn(f.reratings,x)))return;const changes=Object.fromEntries(items.map(x=>[x,f.reratings[x]-f.initialRatings[x]]));event("reratings_submitted",{reratings:f.reratings,changes,group_ratings:f.groupRatings,feedback_items:f.feedbackItems,omitted_items:f.omittedItems,comparison_source:f.comparisonSource,comparison_source_age:f.comparisonSourceAge,low_position:f.lowPosition+1,control_position:f.controlPosition+1,high_position:f.highPosition===null?null:f.highPosition+1,low_threshold_met:f.lowThresholdMet,low_selection_rule:f.lowSelectionRule,control_delta:f.controlDelta,high_target_included:f.highTargetIncluded,high_selection_rule:f.highSelectionRule},f.key);if(state.feedbackIndex===0){state.memorySequence=Array.from({length:10},()=>ri(0,9));state.memoryStartedAt=null;state.screen="memory_intro"}else{state.screen="final_questions"}persist();render();scrollTo(0,0)});
    on("submit-final",()=>{if(state.finalSelfSatisfaction===null||state.nationalIdentityImportance===null||state.teenVoteReaction===null||state.adultVoteReaction===null||!state.combinedAttentionResponse){error="Ответьте на все обязательные вопросы.";render();return}state.combinedAttentionCorrect=state.combinedAttentionResponse==="19_49";const participantAge=+state.demographics.age;const combinedCheck={selected_pair:state.combinedAttentionResponse,correct_pair:"19_49",correct:state.combinedAttentionCorrect,ages:[participantAge,49],participant_age:participantAge};event("attention_checks_submitted",{combined_check:combinedCheck});state.completed=true;go("final","survey_completed",{final_ability_self_rating:state.finalAbilitySelfRating,final_self_satisfaction:state.finalSelfSatisfaction,national_identity_importance:state.nationalIdentityImportance,national_identity_group:"россияне",same_age_vote_reaction:state.teenVoteReaction,participant_age_vote_reaction:state.teenVoteReaction,participant_19_vote_reaction:state.teenVoteReaction,participant_49_vote_reaction:state.adultVoteReaction,teen_vote_reaction:state.teenVoteReaction,adult_vote_reaction:state.adultVoteReaction,combined_attention_response:state.combinedAttentionResponse,combined_attention_correct:state.combinedAttentionCorrect,attention_checks:[combinedCheck],study_purpose_guess:state.studyPurposeGuess.trim()||null})});
    on("memory-start",()=>{state.memoryStartedAt=Date.now();go("memory","memory_task_started",{duration_ms:30000},state.categories[0].key)});
  }
  const csel=()=>state.categories[state.categoryIndex];
  function startMemory(){const started=state.memoryStartedAt||Date.now();memoryTimer=setInterval(()=>{const elapsed=Date.now()-started,remain=Math.max(0,Math.ceil((30000-elapsed)/1000)),idx=Math.min(9,Math.floor(elapsed/3000)),visible=elapsed%3000<2000;const n=document.getElementById("memory-number"),t=document.getElementById("timer"),b=document.getElementById("memory-bar");if(n)n.textContent=visible?state.memorySequence[idx]:"";if(t)t.textContent=remain+" сек.";if(b)b.style.width=Math.min(100,elapsed/300)+"%";if(elapsed>=30000){clearInterval(memoryTimer);state.feedbackIndex=1;go("group_exposure","memory_task_completed",{duration_ms:elapsed,sequence:state.memorySequence},state.categories[0].key)}},100)}
  if(!state.events.some(e=>e.eventType==="page_opened"))event("page_opened",{delivery:"immediate"});
  render();persist();save();
})();
</script>
